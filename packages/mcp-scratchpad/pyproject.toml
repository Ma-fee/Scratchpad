[project]
name = "mcp-scratchpad"
version = "2.1.0"
description = "基于 FastMCP 的高质量文件管理服务器"
readme = "README.md"
authors = [
    { name = "Leoyzen", email = "leoyzen@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.1",
    "fsspec>=2024.1.0",
    "httpx<1.0",
    "httpx-sse>=0.4.3",
    "pillow>=10.0.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "pypdf>=3.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "factory-boy>=3.3.0",
    "faker>=20.0.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
s3 = [
    "s3fs>=2024.1.0",
]
moto = [
    "moto[s3]>=5.0.0",
    "boto3>=1.34.0",
]

[project.scripts]
mcp-scratchpad = "mcp_scratchpad.server:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "performance: Performance and benchmark tests",
    "benchmark: Benchmark tests",
    "security: Security tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
lint.select = ["E", "F", "W", "I", "N", "B", "C90", "UP"]
lint.ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "factory-boy>=3.3.3",
    "faker>=38.2.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]
